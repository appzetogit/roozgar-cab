# ip_hash, not round-robin: Socket.IO opens with HTTP long-polling, whose
# handshake spans several requests that must all reach the same process. A
# client sticks to one instance for as long as that instance stays up.
# max_fails/fail_timeout give passive health checking — a process that refuses
# or errors 3 times is taken out of rotation for 15s.
upstream zicab_api {
    ip_hash;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:5003 max_fails=3 fail_timeout=15s;
    keepalive 64;
}
