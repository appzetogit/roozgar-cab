server {
    server_name roozgarcab.com www.roozgarcab.com;

    root /var/www/roozgarcab;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/webp;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=roozgarcab_api burst=100 nodelay;
        proxy_pass http://roozgarcab_api;
    }

    # Uploaded images live on disk under UPLOAD_DIR (see Backend/.env) and are
    # served by nginx straight from there; Node only writes them.
    location /uploads/ {
        alias /var/www/roozgarcab-uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /health {
        proxy_pass http://roozgarcab_api;
    }

    location /socket.io/ {
        proxy_pass http://roozgarcab_api;
        # A location that sets any proxy header inherits none from the
        # server block, so the client-address headers are repeated here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached. It names the hashed asset files, and each
    # deploy replaces them and removes the previous ones — so a browser holding a
    # stale copy asks for chunks that no longer exist and renders a blank page.
    # The assets themselves stay immutable for a year; only the entry point is
    # revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/roozgarcab.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/roozgarcab.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.roozgarcab.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = roozgarcab.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name roozgarcab.com www.roozgarcab.com;
    return 404;
}
