# Per-client request limit for the API, keyed on the connecting address.
# Real traffic peaks at about 22 requests in one second from one address
# (an admin page loading its data in parallel); 30/s with a burst of 100
# leaves that untouched and stops floods before they reach Node.
limit_req_zone $binary_remote_addr zone=zicab_api:20m rate=30r/s;
limit_req_status 429;
limit_req_log_level warn;
